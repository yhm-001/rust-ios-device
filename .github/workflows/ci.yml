name: CI-Windows-BuildOnly
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # 缓存vcpkg的openssl静态库，避免每次重新下载编译openssl
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed\x64-windows-static
          key: vcpkg-openssl-x64-static

      - name: Load MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install OpenSSL via vcpkg
        run: vcpkg install openssl:x64-windows-static

      - name: Set openssl‑sys environment variables
        run: |
          echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      # Rust workspace缓存，开启cache‑workspaces适配多crate项目
      - name: Cargo build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-workspaces: true
          save-if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}

      # 关键：-p ios‑cli 指定编译二进制包，产物为 target/release/ios.exe
      - name: Build release exe
        run: cargo build --release -p ios-cli

      # 调试步骤：打印release目录内容，方便排查文件缺失
      - name: List target/release (debug)
        if: always()
        run: Get-ChildItem target/release -ErrorAction SilentlyContinue

      # 仅编译成功才执行上传；路径修正为ios.exe
      - name: Upload Windows exe artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rust-ios-device-windows-exe
          path: target/release/ios.exe
          if-no-files-found: error
