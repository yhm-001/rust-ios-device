name: CI-Windows-BuildOnly
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Load MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # =====官方vcpkg action，自带缓存，不需要手写actions/cache=====
      - name: Setup vcpkg & install openssl
        uses: actions/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'a8f39c024f30eb0a563c1233901f753cfe5f9208' #锁定vcpkg提交，固定ABI，防止版本漂移
          vcpkgArguments: openssl:x64-windows-static
          # 开启vcpkg内置二进制缓存（actions缓存自动管理packages/downloads/installed）
          vcpkgBinaryCache: true

      - name: Set openssl‑sys environment variables
        run: |
          echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: Cargo build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-workspaces: true
          save-if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}

      - name: Build release exe
        run: cargo build --release -p ios-cli

      - name: List target/release (debug)
        if: always()
        run: Get-ChildItem target/release -ErrorAction SilentlyContinue

      - name: Upload Windows exe artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rust-ios-device-windows-exe
          path: target/release/ios.exe
          if-no-files-found: error
