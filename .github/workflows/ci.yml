name: CI-Windows-BuildOnly
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenSSL via vcpkg
        uses: ilammy/msvc-dev-cmd@v1
      - run: vcpkg install openssl:x64-windows-static
      - name: Set openssl‑sys environment
        run: |
          echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release exe
        run: cargo build --release

      - name: Upload Windows exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-ios-device-windows-exe
          path: target/release/rust-ios-device.exe
          if-no-files-found: error
