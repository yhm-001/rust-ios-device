name: CI-Windows-BuildOnly
on:
  push:
    branches: [yhm-001-patch-1, dev]
  pull_request:
    branches: [yhm-001-patch-1, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # vcpkg在github windows‑latest runner默认位置C:\vcpkg
      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\packages
            C:\vcpkg\downloads
            C:\vcpkg\installed
          key: vcpkg-openssl-x64-windows-static-md

      # 调用项目内置复合action，处理msvc+vcpkg openssl，自动输出全部环境变量
      - name: Setup native dependencies(OpenSSL/MSVC)
        uses: ./.github/actions/native-deps

      - name: Cargo build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-workspaces: true
          save-if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}

      - name: Build release exe
        run: cargo build --release -p ios-cli

      - name: List target/release (debug)
        if: always()
        run: Get-ChildItem target/release -ErrorAction SilentlyContinue

      - name: Upload Windows exe artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rust-ios-device-windows-exe
          path: target/release/ios.exe
          if-no-files-found: error
