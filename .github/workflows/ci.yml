name: CI-Windows-BuildOnly
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  VCPKG_ROOT: C:\vcpkg

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # 拉取vcpkg
      - name: Clone vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          cd $env:VCPKG_ROOT
          git checkout a8f39c024f30eb0a563c1233901f753cfe5f9208
          .\bootstrap-vcpkg.bat

      # 缓存完整vcpkg相关目录，key绑定vcpkg commit hash，版本一变缓存自动失效
      - name: Cache vcpkg packages/downloads/installed
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\packages
            C:\vcpkg\downloads
            C:\vcpkg\installed
          key: vcpkg-openssl-x64-static-a8f39c024f30eb0a563c1233901f753cfe5f9208

      - name: Load MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install OpenSSL via vcpkg
        run: C:\vcpkg\vcpkg.exe install openssl:x64-windows-static

      - name: Set openssl‑sys environment variables
        run: |
          echo "OPENSSL_DIR=$env:VCPKG_ROOT\installed\x64-windows-static" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: Cargo build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-workspaces: true
          save-if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}

      - name: Build release exe
        run: cargo build --release -p ios-cli

      - name: List target/release (debug)
        if: always()
        run: Get-ChildItem target/release -ErrorAction SilentlyContinue

      - name: Upload Windows exe artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rust-ios-device-windows-exe
          path: target/release/ios.exe
          if-no-files-found: error
